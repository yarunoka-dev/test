name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Building needs a checkout, so this job holds no write scope; the
  # write-scoped release job below never executes repository code.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The declared version and the tag must be the same claim: a tag on
      # a tree whose constant says otherwise would ship a summary output
      # that contradicts the release it came from.
      - name: Verify the tag matches the declared kit version
        run: |
          declared="$(sed -n 's/^const KitVersion = "\(.*\)"$/\1/p' internal/kit/version.go)"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "KitVersion is $declared but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build the per-platform binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="yarunoka-test"
            [ "$os" = "windows" ] && bin="yarunoka-test.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$bin" ./cmd/yarunoka-test
            if [ "$os" = "windows" ]; then
              zip -q "dist/yarunoka-test_${GITHUB_REF_NAME}_${os}_${arch}.zip" "$bin"
            else
              tar -czf "dist/yarunoka-test_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$bin"
            fi
            rm "$bin"
          done
          (cd dist && sha256sum -- * > checksums.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # No checkout: gh operates on the remote repository directly, so the
  # job never executes repository code with a write-scoped token.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
