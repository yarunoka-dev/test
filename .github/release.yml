# Release notes list changes that can reach users. `internal` marks PRs that
# touch nothing shipped (CI, tests, dev tooling, repo meta) — judged by what
# was touched, not by the author's impact prediction. Unlike the PHP
# repositories, Renovate is not excluded by author here: a Go module bump is
# baked into the released binary, so dependency PRs are told apart by label
# (Renovate labels gomod bumps `dependencies` and workflow pin bumps
# `internal` — see renovate.json).
changelog:
  exclude:
    labels:
      - internal
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Enhancements
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
